[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalm-jev"
version = "0.1.0"
description = "Local Choice, Score and Noul judgments using KaLM R2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=5.3,<6", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kalm-jev = "kalm_jev.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
